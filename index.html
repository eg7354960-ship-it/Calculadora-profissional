<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Digital • Pro</title>
    <style>
        /* Reset e tipografia */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        /* Fundo animado com gradiente e brilhos */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
            overflow-x: hidden;

            background: linear-gradient(
                -45deg,
                #05001a,
                #0f0040,
                #003055,
                #120042,
                #001d33
            );
            background-size: 400% 400%;
            animation: gradientMove 14s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Brilhos flutuantes no fundo */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.22;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background: #00eaff;
            top: -100px;
            left: -80px;
            animation: float1 10s infinite alternate ease-in-out;
        }

        body::after {
            background: #8a2be2;
            bottom: -100px;
            right: -80px;
            animation: float2 12s infinite alternate ease-in-out;
        }

        @keyframes float1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(140px, 100px) scale(1.2); }
        }

        @keyframes float2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-130px, -90px) scale(1.1); }
        }

        /* Card principal */
        .app {
            position: relative;
            z-index: 2;
            width: min(100%, 440px);
            padding: 26px 24px 22px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            background: rgba(8, 10, 26, 0.75);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px rgba(255, 255, 255, 0.08),
                0 0 0 1px rgba(0, 200, 255, 0.05);
        }

        /* Relógio */
        .clock {
            text-align: center;
            margin-bottom: 22px;
        }

        .clock-title {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 6px;
            font-weight: 500;
        }

        #clock {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: clamp(30px, 9vw, 44px);
            font-weight: 600;
            letter-spacing: 2px;
            color: #7df9ff;
            text-shadow: 0 0 18px rgba(125, 249, 255, 0.6), 0 0 40px rgba(125, 249, 255, 0.2);
            transition: text-shadow 0.3s;
        }

        /* Tela da calculadora */
        .display {
            min-height: 130px;
            padding: 18px 20px;
            margin-bottom: 20px;
            border-radius: 22px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(125, 249, 255, 0.14);
            box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            overflow: hidden;
        }

        .history {
            width: 100%;
            text-align: right;
            min-height: 22px;
            font-size: 14px;
            opacity: 0.5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .result {
            width: 100%;
            text-align: right;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: clamp(34px, 10vw, 50px);
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            line-height: 1.2;
        }

        /* Grid de botões */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 11px;
        }

        button {
            height: 70px;
            border: none;
            border-radius: 18px;
            color: white;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow:
                0 6px 16px rgba(0, 0, 0, 0.25),
                inset 0 1px rgba(255, 255, 255, 0.06);
            transition:
                transform 0.1s ease,
                background 0.15s ease,
                box-shadow 0.15s ease,
                border-color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: scale(0.93);
            background: rgba(255, 255, 255, 0.2);
        }

        /* Estilos especiais */
        .operator {
            color: #7df9ff;
            background: rgba(0, 210, 255, 0.09);
            border-color: rgba(0, 210, 255, 0.1);
        }

        .operator:hover {
            background: rgba(0, 220, 255, 0.18);
            border-color: rgba(0, 220, 255, 0.25);
        }

        .clear {
            color: #ff7b9c;
            background: rgba(255, 80, 120, 0.07);
            border-color: rgba(255, 80, 120, 0.1);
        }

        .clear:hover {
            background: rgba(255, 80, 120, 0.16);
            border-color: rgba(255, 80, 120, 0.25);
        }

        .equal {
            background: linear-gradient(135deg, #0099ff, #6a2cff);
            box-shadow: 0 8px 24px rgba(60, 70, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 24px;
        }

        .equal:hover {
            background: linear-gradient(135deg, #1aa9ff, #7b3cff);
            box-shadow: 0 10px 28px rgba(60, 70, 255, 0.5);
        }

        .zero {
            grid-column: span 2;
        }

        /* Rodapé */
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 10px;
            opacity: 0.35;
            letter-spacing: 2px;
            font-weight: 400;
            text-transform: uppercase;
        }

        /* Ajustes para telas pequenas */
        @media (max-width: 380px) {
            .app {
                padding: 18px 16px 16px;
                border-radius: 26px;
            }

            button {
                height: 60px;
                border-radius: 15px;
                font-size: 20px;
            }

            .display {
                min-height: 110px;
                padding: 14px 16px;
            }

            .result {
                font-size: 36px;
            }

            #clock {
                font-size: 30px;
            }

            .buttons {
                gap: 8px;
            }
        }

        @media (max-width: 320px) {
            button {
                height: 52px;
                font-size: 18px;
                border-radius: 13px;
            }

            .result {
                font-size: 30px;
            }

            #clock {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <!-- Relógio digital -->
        <section class="clock">
            <div class="clock-title">Relógio digital</div>
            <div id="clock">00:00:00</div>
        </section>

        <!-- Visor da calculadora -->
        <section class="display">
            <div class="history" id="history"></div>
            <div class="result" id="display">0</div>
        </section>

        <!-- Teclado -->
        <section class="buttons">
            <button class="clear" onclick="clearCalculator()">AC</button>
            <button onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="percentage()">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendDecimal()">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </section>

        <div class="footer">
            Calculadora Digital • HTML • CSS • JavaScript
        </div>
    </main>

    <script>
        // === Estado da calculadora ===
        let current = "0";
        let previous = null;
        let operator = null;
        let resetScreen = false;

        const display = document.getElementById("display");
        const history = document.getElementById("history");

        // === Atualiza visor ===
        function updateDisplay() {
            display.textContent = current;
        }

        // === Números ===
        function appendNumber(number) {
            if (current === "Erro" || resetScreen) {
                current = number;
                resetScreen = false;
            } else {
                current = current === "0" ? number : current + number;
            }
            updateDisplay();
        }

        // === Decimal ===
        function appendDecimal() {
            if (resetScreen) {
                current = "0.";
                resetScreen = false;
                updateDisplay();
                return;
            }
            if (!current.includes(".")) {
                current += ".";
                updateDisplay();
            }
        }

        // === Operador ===
        function chooseOperator(op) {
            if (current === "Erro") return;

            if (operator !== null && !resetScreen) {
                calculate();
            }

            previous = parseFloat(current);
            operator = op;
            resetScreen = true;
            history.textContent = `${formatNumber(previous)} ${operatorSymbol(op)}`;
        }

        // === Cálculo ===
        function calculate() {
            if (operator === null || previous === null) return;

            const currentNumber = parseFloat(current);
            let result;

            switch (operator) {
                case "+": result = previous + currentNumber; break;
                case "-": result = previous - currentNumber; break;
                case "*": result = previous * currentNumber; break;
                case "/":
                    if (currentNumber === 0) {
                        current = "Erro";
                        history.textContent = "Divisão por zero";
                        resetScreen = true;
                        operator = null;
                        previous = null;
                        updateDisplay();
                        return;
                    }
                    result = previous / currentNumber;
                    break;
            }

            history.textContent =
                `${formatNumber(previous)} ${operatorSymbol(operator)} ${formatNumber(currentNumber)} =`;

            current = formatNumber(result);
            operator = null;
            previous = null;
            resetScreen = true;
            updateDisplay();
        }

        // === Porcentagem ===
        function percentage() {
            if (current === "Erro") return;
            const value = parseFloat(current);
            current = formatNumber(value / 100);
            updateDisplay();
        }

        // === Apagar último dígito ===
        function deleteLast() {
            if (resetScreen || current === "Erro") {
                current = "0";
                resetScreen = false;
            } else {
                current = current.length > 1 ? current.slice(0, -1) : "0";
            }
            updateDisplay();
        }

        // === Limpar tudo ===
        function clearCalculator() {
            current = "0";
            previous = null;
            operator = null;
            resetScreen = false;
            history.textContent = "";
            updateDisplay();
        }

        // === Símbolos ===
        function operatorSymbol(op) {
            const symbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };
            return symbols[op] || "";
        }

        // === Formatação numérica ===
        function formatNumber(number) {
            if (!Number.isFinite(number)) return "Erro";
            const rounded = Math.round((number + Number.EPSILON) * 100000000) / 100000000;
            return String(rounded);
        }

        // === Relógio ===
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const seconds = String(now.getSeconds()).padStart(2, "0");
            document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // === Teclado físico ===
        document.addEventListener("keydown", (event) => {
            const key = event.key;

            if (/^[0-9]$/.test(key)) {
                appendNumber(key);
            } else if (key === "." || key === ",") {
                appendDecimal();
            } else if (["+", "-", "*", "/"].includes(key)) {
                chooseOperator(key);
            } else if (key === "Enter" || key === "=") {
                event.preventDefault();
                calculate();
            } else if (key === "Backspace") {
                deleteLast();
            } else if (key === "Escape") {
                clearCalculator();
            } else if (key === "%") {
                percentage();
            }
        });
    </script>
</body>
</html>
